[project]
name = "smugly"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "requests==2.32.3",
    "requests-oauthlib==2.0.0",
    "pydantic-settings==2.6.1",
    "pillow==11.0.0",
    "pillow-heif==0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smugly"]
